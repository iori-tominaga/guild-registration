<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古代の門 — 冒険者ギルド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; min-height: 100%;
    background: #000810;
    font-family: 'Press Start 2P', monospace;
    color: #fff;
    overflow-x: hidden;
  }
  /* ─── Stars + stone fog ─── */
  .stars {
    position: fixed; inset: 0;
    background:
      radial-gradient(1px 1px at 10% 15%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 70%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 30%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 80%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 20%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 50%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 60%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 45%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 90%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 10%, #fff 0%, transparent 100%);
    pointer-events: none; z-index: 0;
  }
  .stone-fog {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 20% 100%, rgba(90,74,58,0.20), transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(70,60,50,0.18), transparent 55%);
    pointer-events: none; z-index: 0;
  }

  /* ─── DQ window (shared) ─── */
  .dq-window {
    background: #000060;
    border: 4px solid #c8c8c8;
    outline: 4px solid #000060;
    box-shadow: inset 0 0 0 2px #ffffff, 0 0 0 2px #000, 6px 6px 0 #000;
    image-rendering: pixelated;
    position: relative;
  }
  .dq-window::before {
    content: ''; position: absolute; inset: 3px;
    border: 2px solid #4848b8; pointer-events: none;
  }
  .dq-title-bar {
    background: #000060; border-bottom: 2px solid #c8c8c8;
    padding: 10px 16px; text-align: center; letter-spacing: 2px;
    font-size: 11px; color: #ffec40; text-shadow: 2px 2px #000;
  }
  .dq-content { padding: 20px; }
  .dq-btn {
    background: #000060;
    border: 3px solid #c8c8c8;
    outline: 2px solid #000;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    padding: 12px 28px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.05s;
    box-shadow: 3px 3px 0 #000;
    min-height: 44px;
  }
  .dq-btn:hover { background: #2020a0; color: #ffec40; border-color: #ffec40; }
  .dq-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }

  /* ─── Page header ─── */
  .page-header {
    text-align: center; margin-bottom: 28px; position: relative;
  }
  .page-header .deco {
    font-size: 10px; color: #5a4a3a; letter-spacing: 6px; margin-bottom: 8px;
  }
  .page-header .ja-title {
    font-size: 18px; color: #ffd700; letter-spacing: 6px;
    text-shadow: 2px 2px #000, 0 0 18px rgba(255,215,0,0.45);
    margin-bottom: 6px;
  }
  .page-header .en-title {
    font-size: 9px; color: #a08a72; letter-spacing: 4px;
  }
  .page-intro {
    font-size: 8px; color: #c0a888; line-height: 2.2; letter-spacing: 1px;
    text-align: center; margin: 14px 8px 28px;
  }

  /* ─── Section title ─── */
  .section-title {
    text-align: center; margin: 28px 0 14px;
    font-size: 12px; letter-spacing: 4px;
  }
  .section-title.active   { color: #ffd700; text-shadow: 0 0 12px rgba(255,215,0,0.6), 2px 2px #000; }
  .section-title.dormant  { color: #6a5a4a; text-shadow: 2px 2px #000; }
  .section-rule {
    height: 1px; background: linear-gradient(90deg, transparent, #5a4a3a, transparent);
    margin-bottom: 18px;
  }

  /* ─── Gate card (stone arch) ─── */
  .gate {
    position: relative;
    margin: 0 auto 22px;
    max-width: 460px;
    padding: 38px 22px 22px;
    background:
      linear-gradient(180deg, #3a2a1a 0%, #2a1c0e 100%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.10) 0 2px, transparent 2px 6px);
    border: 4px solid #5a4a3a;
    outline: 2px solid #1a1208;
    box-shadow: inset 0 0 0 2px #2a1c10, inset 0 0 30px rgba(0,0,0,0.6), 6px 6px 0 #000;
  }
  /* arch top: a half-disc above the card */
  .gate::before {
    content: ''; position: absolute;
    left: 8%; right: 8%; top: -32px; height: 56px;
    background: linear-gradient(180deg, #5a4a3a 0%, #44382c 100%);
    border: 4px solid #5a4a3a; border-bottom: none;
    border-radius: 100px 100px 0 0;
    box-shadow: inset 0 0 0 2px #2a1c10;
  }
  /* keystone */
  .gate::after {
    content: ''; position: absolute;
    left: 50%; top: -18px;
    width: 22px; height: 22px;
    background: #6e5c48;
    border: 2px solid #1a1208;
    transform: translateX(-50%) rotate(45deg);
    box-shadow: inset 0 0 0 1px #44382c;
  }

  .gate-icon {
    text-align: center;
    font-size: 32px;
    margin: 0 0 10px;
    filter: drop-shadow(0 0 0 #000);
  }
  .gate-name {
    text-align: center;
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 4px;
  }
  .gate-target {
    text-align: center;
    font-size: 8px;
    color: #a08a72;
    letter-spacing: 1px;
    margin-bottom: 16px;
  }
  .gate-meta {
    border-top: 1px solid #5a4a3a;
    padding-top: 14px;
    font-size: 8px;
    line-height: 2;
    letter-spacing: 1px;
  }
  .gate-meta dt {
    color: #c0a888;
    margin-bottom: 4px;
    font-size: 8px;
  }
  .gate-meta dd {
    color: #ffeec0;
    margin-bottom: 10px;
    padding-left: 8px;
  }
  .gate-meta dd ul { list-style: none; padding-left: 0; }
  .gate-meta dd li::before { content: '◆ '; color: #c08040; }
  .transport-badge {
    display: inline-block;
    font-size: 7px; padding: 3px 8px;
    background: #44382c; color: #ffeec0;
    border: 1px solid #6e5c48;
    letter-spacing: 1px;
  }

  /* ─── Active gate: glowing runes ─── */
  .gate.active { border-color: #ffd700; }
  .gate.active::before { border-color: #ffd700; background: linear-gradient(180deg, #8a6a30 0%, #5a4220 100%); }
  .gate.active::after  { background: #ffd700; border-color: #8a6a30; box-shadow: 0 0 16px rgba(255,215,0,0.7), inset 0 0 0 1px #8a6a30; }
  .gate.active .gate-name { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.55), 2px 2px #000; }
  .gate.active .gate-icon { animation: rune-pulse 2.2s ease-in-out infinite; }
  @keyframes rune-pulse {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(255,215,0,0.6)) drop-shadow(0 0 8px rgba(255,215,0,0.3)); }
    50%      { filter: drop-shadow(0 0 10px rgba(255,235,80,0.95)) drop-shadow(0 0 18px rgba(255,215,0,0.6)); }
  }
  .connected-badge {
    display: inline-block;
    font-size: 8px; padding: 4px 10px;
    background: #4a3a10; color: #ffd700;
    border: 1px solid #ffd700;
    letter-spacing: 2px;
    margin: 0 auto 12px;
    box-shadow: 0 0 12px rgba(255,215,0,0.35);
  }
  .connected-badge-wrap { text-align: center; }

  /* ─── Dormant gate: mossy gray ─── */
  .gate.dormant {
    background:
      linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.10) 0 2px, transparent 2px 6px);
    border-color: #3a3a3a;
    box-shadow: inset 0 0 0 2px #1a1a1a, inset 0 0 30px rgba(0,0,0,0.7), 6px 6px 0 #000;
    opacity: 0.78;
  }
  .gate.dormant::before { background: linear-gradient(180deg, #3a3a3a 0%, #1a2820 100%); border-color: #3a3a3a; }
  .gate.dormant::after  { background: #2a3a2a; border-color: #1a2018; box-shadow: inset 0 0 0 1px #1a1a1a; }
  .gate.dormant .gate-icon { filter: grayscale(0.85) brightness(0.6); }
  .gate.dormant .gate-name { color: #6a5a4a; }
  .gate.dormant .gate-target { color: #4a4030; }
  .gate.dormant .gate-meta dt { color: #5a4a3a; }
  .gate.dormant .gate-meta dd { color: #6a5a4a; }
  .gate.dormant .gate-meta dd li::before { color: #44382c; }
  .gate.dormant .transport-badge { background: #1a1a1a; color: #5a4a3a; border-color: #2a2a2a; }
  .dormant-badge {
    display: inline-block;
    font-size: 8px; padding: 4px 10px;
    background: #1a1a1a; color: #5a4a3a;
    border: 1px solid #3a3a3a;
    letter-spacing: 2px;
    margin: 0 auto 12px;
  }

  /* ─── Fade in ─── */
  .fade-in { animation: fadeIn 0.35s ease-out both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .blink { animation: blink 0.8s steps(1) infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  @media (max-width: 520px) {
    .gate { padding: 32px 14px 18px; max-width: 100%; }
    .gate-name { font-size: 11px; letter-spacing: 2px; }
    .page-header .ja-title { font-size: 14px; letter-spacing: 4px; }
    .dq-btn { font-size: 9px; padding: 10px 18px; min-height: 44px; }
  }
</style>
</head>
<body>
<div class="stars"></div>
<div class="stone-fog"></div>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

// ─── Audio ───────────────────────────────────────────────────────
let audioCtx = null;
const A = () => (audioCtx ||= new (window.AudioContext || window.webkitAudioContext)());
function beep(freq=440, dur=0.08, type='square', vol=0.12) {
  try {
    const c = A(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = type; o.frequency.setValueAtTime(freq, c.currentTime);
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.start(); o.stop(c.currentTime + dur);
  } catch(e) {}
}
const selectSound = () => [523,659].forEach((f,i) => setTimeout(() => beep(f,0.08,'square',0.15), i*60));

// ─── Typewriter ──────────────────────────────────────────────────
function useTypewriter(text, speed=40) {
  const [out, setOut] = useState('');
  useEffect(() => {
    setOut(''); let i = 0;
    const id = setInterval(() => {
      i++; setOut(text.slice(0, i));
      if (i >= text.length) clearInterval(id);
    }, speed);
    return () => clearInterval(id);
  }, [text, speed]);
  return [out];
}

// ─── Gates data ──────────────────────────────────────────────────
const GATES = [
  {
    id: 'github',
    icon: '🐙',
    name: 'ギットハブの門',
    target: 'github.com',
    capabilities: [
      'リポジトリの Issue / PR 取得・作成',
      'コミット履歴・差分の参照',
      'ファイル内容の読み書き',
    ],
    transport: 'stdio',
    connected: true,
  },
  {
    id: 'atlassian',
    icon: '🏔️',
    name: 'アトラシアンの門',
    target: 'atlassian.net',
    capabilities: [
      'Jira チケットの取得・作成',
      'Confluence ページの参照',
      'ステータス変更・コメント追加',
    ],
    transport: 'stdio',
    connected: false,
  },
  {
    id: 'slack',
    icon: '💬',
    name: 'スラックの門',
    target: 'slack.com',
    capabilities: [
      'チャンネルへのメッセージ投稿',
      'スレッド返信・リアクション',
      'DM の送受信',
    ],
    transport: 'stdio',
    connected: false,
  },
  {
    id: 'filesystem',
    icon: '📁',
    name: 'ファイル界の門',
    target: 'local filesystem',
    capabilities: [
      'ディレクトリの走査',
      'ファイルの読み書き',
      'パターン検索',
    ],
    transport: 'stdio',
    connected: false,
  },
  {
    id: 'fetch',
    icon: '🌐',
    name: '網世界の門',
    target: 'World Wide Web',
    capabilities: [
      'URL への HTTP リクエスト',
      'Web ページ取得',
      'JSON / HTML 解析',
    ],
    transport: 'HTTP',
    connected: false,
  },
];

// ─── Gate card ────────────────────────────────────────────────────
function GateCard({ gate }) {
  return (
    <div className={`gate fade-in ${gate.connected ? 'active' : 'dormant'}`}>
      <div className="gate-icon">{gate.icon}</div>
      <div className="gate-name">{gate.name}</div>
      <div className="gate-target">{gate.target}</div>
      {gate.connected ? (
        <div className="connected-badge-wrap">
          <span className="connected-badge">◆ せつぞくちゅう ◆</span>
        </div>
      ) : (
        <div className="connected-badge-wrap">
          <span className="dormant-badge">… ねむれる門 …</span>
        </div>
      )}
      <dl className="gate-meta">
        <dt>つながるさき</dt>
        <dd>{gate.target}</dd>
        <dt>できること</dt>
        <dd>
          <ul>
            {gate.capabilities.map((c, i) => <li key={i}>{c}</li>)}
          </ul>
        </dd>
        <dt>つたえかた</dt>
        <dd><span className="transport-badge">{gate.transport}</span></dd>
      </dl>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────
function App() {
  const [tw] = useTypewriter('「ふるくよりねむる門は、外なる世界へつづく」', 45);
  useEffect(() => {
    const sel = '.dq-btn';
    function onDown(e) {
      const t = e.target.closest(sel);
      if (!t) return;
      t.classList.add('pressing');
      t.addEventListener('mouseleave', () => t.classList.remove('pressing'), { once: true });
    }
    function onUp() { document.querySelectorAll('.pressing').forEach(el => el.classList.remove('pressing')); }
    function onMenu(e) { if (e.target.closest(sel)) e.preventDefault(); }
    document.addEventListener('mousedown', onDown);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchstart', onDown, { passive: true });
    document.addEventListener('touchend', onUp);
    document.addEventListener('contextmenu', onMenu);
    return () => {
      document.removeEventListener('mousedown', onDown);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchstart', onDown);
      document.removeEventListener('touchend', onUp);
      document.removeEventListener('contextmenu', onMenu);
    };
  }, []);

  const active   = GATES.filter(g => g.connected);
  const dormant  = GATES.filter(g => !g.connected);

  return (
    <div style={{
      minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center',
      padding: '24px 12px 40px',
      paddingTop: 'max(24px, env(safe-area-inset-top))',
      position: 'relative', zIndex: 1,
    }}>
      <div className="page-header">
        <div className="deco">⛩ ⛩ ⛩</div>
        <div className="ja-title">古代の門</div>
        <div className="en-title">ANCIENT PORTALS</div>
      </div>

      <div className="page-intro fade-in">
        {tw}<span className="blink">█</span>
      </div>

      <div style={{ width: '100%', maxWidth: 520 }}>
        <div className="section-title active">◆ ひらかれし　門 ◆</div>
        <div className="section-rule"/>
        {active.length === 0 ? (
          <div style={{textAlign:'center', fontSize:9, color:'#5a4a3a', padding:'20px 0', letterSpacing:1, lineHeight:2}}>
            まだ ひらかれた門は ない。<br/>
            ～ Claude Code で claude mcp add を となえよ ～
          </div>
        ) : (
          active.map(g => <GateCard key={g.id} gate={g}/>)
        )}

        <div className="section-title dormant">… ねむれる　門 …</div>
        <div className="section-rule"/>
        {dormant.map(g => <GateCard key={g.id} gate={g}/>)}

        <div style={{textAlign:'center', marginTop:24}}>
          <button className="dq-btn" onClick={() => { selectSound(); location.href='board.html'; }}>
            ← ギルド本部へ戻る
          </button>
        </div>
      </div>

      <div style={{marginTop:20, fontSize:7, color:'#3a2a1a', textAlign:'center', letterSpacing:2}}>
        ANCIENT PORTALS © {new Date().getFullYear()}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
