<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>バトル - 冒険者ギルド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="icons.js"></script>
<script src="parts.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-darkest: #000810;
  --win-bg: #000060;
  --win-inner: #000030;
  --yellow: #ffec40;
  --gold: #ffd700;
  --text-pale: #c0d8ff;
  --text-purple: #a0c0ff;
  --border-gray: #c8c8c8;
  --hp-green: #40ff40;
  --hp-green-dark: #20c020;
  --mp-blue: #40b0ff;
  --mp-blue-dark: #2070c0;
  --red: #ff8080;
  --red-dark: #c02020;
}
html, body {
  width: 100%; min-height: 100vh;
  background: var(--bg-darkest);
  font-family: 'Press Start 2P', monospace;
  color: #fff; overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}
.stars {
  position: fixed; inset: 0;
  background:
    radial-gradient(1px 1px at 10% 15%, #fff 0%, transparent 100%),
    radial-gradient(1px 1px at 30% 70%, #fff 0%, transparent 100%),
    radial-gradient(1px 1px at 50% 30%, #fff 0%, transparent 100%),
    radial-gradient(1px 1px at 70% 80%, #fff 0%, transparent 100%),
    radial-gradient(1px 1px at 85% 20%, #fff 0%, transparent 100%),
    radial-gradient(1px 1px at 20% 50%, #fff 0%, transparent 100%),
    radial-gradient(1px 1px at 60% 60%, #fff 0%, transparent 100%),
    radial-gradient(1px 1px at 90% 45%, #fff 0%, transparent 100%),
    radial-gradient(1px 1px at 40% 90%, #fff 0%, transparent 100%),
    radial-gradient(1px 1px at 75% 10%, #fff 0%, transparent 100%);
  pointer-events: none; z-index: 0;
}
.dq-window {
  background: var(--win-bg);
  border: 4px solid var(--border-gray);
  box-shadow: inset 0 0 0 2px #ffffff, 0 0 0 2px #000, 4px 4px 0 #000;
  position: relative;
}
.dq-window::before {
  content: ''; position: absolute; inset: 3px;
  border: 2px solid #4848b8; pointer-events: none;
}
.dq-window-inner { padding: 8px 10px; position: relative; z-index: 1; }
.battle-app {
  width: 100%; max-width: 520px; margin: 0 auto;
  padding: 6px; display: flex; flex-direction: column; gap: 6px;
  position: relative; z-index: 1; min-height: 100vh;
}

/* ─── Field ─── */
.field {
  width: 100%; height: 220px;
  border: 4px solid var(--border-gray);
  box-shadow: inset 0 0 0 2px #ffffff, 0 0 0 2px #000, 4px 4px 0 #000;
  position: relative; overflow: hidden;
}
.field::before {
  content: ''; position: absolute; inset: 3px;
  border: 2px solid #4848b8; pointer-events: none; z-index: 5;
}
.bg-grass    { background: linear-gradient(180deg, #6ad0f0 0%, #b0e0a0 55%, #4a8a3a 100%); }
.bg-forest   { background: linear-gradient(180deg, #5a3020 0%, #b06030 30%, #2a4020 70%, #1a2810 100%); }
.bg-graveyard{ background: linear-gradient(180deg, #1a1838 0%, #2a2858 40%, #3a3a4a 75%, #1a1a25 100%); }
.bg-lava     { background: linear-gradient(180deg, #2a0808 0%, #6a1818 30%, #a04020 60%, #ff6020 90%, #ffaa20 100%); }
.bg-castle   { background: linear-gradient(180deg, #3a3a55 0%, #555570 50%, #404050 100%); }
.bg-deco { position: absolute; bottom: 30px; left: 0; right: 0; height: 60px; pointer-events: none; z-index: 1; }
.ground { position: absolute; left: 0; right: 0; bottom: 0; height: 36px; z-index: 2; }
.ground.grass    { background: repeating-linear-gradient(90deg, #3a7028 0 8px, #2a5a1c 8px 16px), linear-gradient(180deg, #4a8a3a, #2a5a1c); }
.ground.dirt     { background: repeating-linear-gradient(90deg, #4a2810 0 8px, #3a1c08 8px 16px); }
.ground.stone    { background: repeating-linear-gradient(90deg, #555570 0 12px, #404055 12px 24px), linear-gradient(180deg, #555570, #2a2a3a); }
.ground.bone     { background: repeating-linear-gradient(90deg, #2a2a3a 0 8px, #1a1a25 8px 16px), linear-gradient(180deg, #3a3a4a, #1a1a25); }
.ground.lava     { background: repeating-linear-gradient(90deg, #4a1010 0 8px, #2a0808 8px 16px), linear-gradient(180deg, #6a1818, #2a0808); }
.combatant { position: absolute; bottom: 22px; z-index: 3; display: flex; align-items: flex-end; justify-content: center; }
.combatant.monster { left: 6%; width: 35%; height: 130px; }
.combatant.player  { right: 6%; width: 35%; height: 130px; }
.monster-sprite, .player-sprite {
  image-rendering: pixelated;
  filter: drop-shadow(2px 4px 0 rgba(0,0,0,0.5));
  transform-origin: bottom center;
}
.monster-sprite { width: 112px; height: 112px; }
.player-sprite  { width: 96px; height: 128px; transform: scaleX(-1); }

/* Player action animations */
@keyframes p-attack {
  0%   { transform: translate(0,0); }
  30%  { transform: translate(-30px,-6px) rotate(-3deg); }
  50%  { transform: translate(-50px,0) rotate(2deg); }
  70%  { transform: translate(-30px,0) rotate(0deg); }
  100% { transform: translate(0,0); }
}
.player-act-attack > svg { animation: p-attack 0.6s ease-out; transform: scaleX(-1); }
@keyframes p-magic {
  0%   { transform: translate(0,0) scale(1); }
  30%  { transform: translate(0,-6px) scale(1.05); filter: brightness(1.5); }
  60%  { transform: translate(0,-12px) scale(1.08); filter: brightness(2); }
  100% { transform: translate(0,0) scale(1); }
}
.player-act-magic > svg { animation: p-magic 0.7s ease-out; transform: scaleX(-1); }
@keyframes p-defend {
  0%   { transform: translate(0,0) scale(1); }
  50%  { transform: translate(8px,6px) scale(0.95); }
  100% { transform: translate(6px,4px) scale(0.92); }
}
.player-act-defend > svg { animation: p-defend 0.4s ease-out both; transform: scaleX(-1); }
@keyframes p-flee {
  0%   { transform: translate(0,0); opacity:1; }
  100% { transform: translate(200px,0); opacity:0; }
}
.player-act-flee > svg { animation: p-flee 0.9s ease-in both; transform: scaleX(-1); }
@keyframes p-hit {
  0%,100% { transform: translate(0,0); }
  20% { transform: translate(6px,-2px) rotate(3deg); filter: brightness(2) hue-rotate(-30deg); }
  40% { transform: translate(-3px,2px) rotate(-2deg); filter: brightness(2) hue-rotate(-30deg); }
  60% { transform: translate(4px,0); filter: brightness(1.8); }
}
.player-act-hit > svg { animation: p-hit 0.4s; transform: scaleX(-1); }

/* Monster animations */
@keyframes m-idle   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
@keyframes m-attack { 0%{transform:translate(0,0)} 30%{transform:translate(40px,-8px)} 50%{transform:translate(60px,0)} 70%{transform:translate(40px,0)} 100%{transform:translate(0,0)} }
@keyframes m-hit    { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px) rotate(-5deg);filter:brightness(2.5) hue-rotate(-40deg)} 40%{transform:translateX(8px) rotate(5deg);filter:brightness(2.5) hue-rotate(-40deg)} 60%{transform:translateX(-5px);filter:brightness(2)} }
@keyframes m-death  { 0%{opacity:1;transform:scale(1) translateY(0)} 100%{opacity:0;transform:scale(0.5) translateY(40px);filter:blur(4px)} }
.monster-sprite.idle     { animation: m-idle 2s ease-in-out infinite; }
.monster-sprite.attacking{ animation: m-attack 0.6s ease-out; }
.monster-sprite.hit      { animation: m-hit 0.4s; }
.monster-sprite.dying    { animation: m-death 0.8s forwards; }

/* Damage popups */
.dmg-pop {
  position: absolute; font-size: 22px; color: #fff;
  text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
  pointer-events: none; animation: dmgFloat 0.9s ease-out forwards; z-index: 10; letter-spacing: 1px;
}
.dmg-pop.heal { color: var(--hp-green); }
.dmg-pop.crit { color: var(--yellow); font-size: 28px; }
.dmg-pop.miss { color: var(--text-purple); font-size: 14px; }
@keyframes dmgFloat {
  0%   { transform: translateY(0) scale(0.6); opacity:0; }
  15%  { transform: translateY(-12px) scale(1.2); opacity:1; }
  100% { transform: translateY(-60px) scale(1); opacity:0; }
}

/* Magic circle */
.magic-circle {
  position: absolute; width: 110px; height: 110px;
  right: 8%; bottom: 20px; pointer-events: none; z-index: 4;
  animation: circleSpin 0.7s linear; opacity: 0;
}
.magic-circle.show { opacity: 1; }
@keyframes circleSpin {
  0%   { opacity:0; transform: scale(0.3) rotate(0deg); }
  40%  { opacity:1; transform: scale(1.2) rotate(180deg); }
  100% { opacity:0; transform: scale(1.5) rotate(360deg); }
}
.magic-fx {
  position: absolute; width: 140px; height: 140px;
  left: 4%; bottom: 30px; pointer-events: none; z-index: 4;
  display: flex; align-items: center; justify-content: center;
  font-size: 56px; opacity: 0;
}
.magic-fx.fire { animation: fireFx 0.7s; text-shadow: 0 0 20px #ff8040; }
.magic-fx.ice  { animation: iceFx 0.7s; }
.magic-fx.bolt { animation: fireFx 0.7s; text-shadow: 0 0 20px #ffec40; }
.magic-fx.heal { animation: healFx 0.7s; }
@keyframes fireFx  { 0%{opacity:0;transform:scale(0.3)} 50%{opacity:1;transform:scale(1.4)} 100%{opacity:0;transform:scale(1.6)} }
@keyframes iceFx   { 0%{opacity:0;transform:scale(0.3) rotate(-30deg)} 50%{opacity:1;transform:scale(1.2) rotate(0deg)} 100%{opacity:0;transform:scale(1.4) rotate(30deg)} }
@keyframes healFx  { 0%{opacity:0;transform:translateY(20px)} 50%{opacity:1;transform:translateY(-10px)} 100%{opacity:0;transform:translateY(-40px)} }

/* Particles */
.elem-particle { position: absolute; width: 6px; height: 6px; pointer-events: none; z-index: 4; animation: partFloat 0.9s ease-out forwards; }
.elem-particle.fire { background: radial-gradient(circle, #ffff40, #ff4020); border-radius:50%; box-shadow: 0 0 6px #ff6020; }
.elem-particle.ice  { background: #c0e8ff; box-shadow: 0 0 6px #80c0ff; }
.elem-particle.bolt { background: #ffff80; box-shadow: 0 0 6px #ffec40; }
@keyframes partFloat { 0%{opacity:1;transform:translate(0,0) scale(1)} 100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0.3)} }

/* Shield */
.shield-up { position: absolute; right: 18%; bottom: 50px; width: 40px; height: 56px; z-index: 4; animation: shieldUp 0.5s ease-out both; }
@keyframes shieldUp { 0%{opacity:0;transform:translateX(40px) scale(0.5)} 100%{opacity:1;transform:translateX(0) scale(1)} }

/* Monster name plate */
.monster-name-plate {
  position: absolute; top: 6px; left: 6px;
  background: rgba(0,0,32,0.85); border: 2px solid var(--border-gray);
  padding: 5px 8px; display: flex; align-items: center; gap: 6px;
  z-index: 6; min-width: 50%; max-width: 55%;
}
.monster-name-plate .name { color:var(--yellow); font-size:9px; letter-spacing:1px; text-shadow:1px 1px 0 #000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
.monster-name-plate .lv   { color:var(--text-purple); font-size:8px; }
.monster-name-plate .hp-mini-row { display:flex; align-items:center; gap:4px; margin-top:3px; }

/* Bars */
.stat-track { height:8px; background:var(--win-inner); border:2px solid #404080; overflow:hidden; }
.stat-fill  { height:100%; transition: width 0.35s ease; }
.hp-fill          { background: linear-gradient(180deg, #80ff80, var(--hp-green) 40%, var(--hp-green-dark)); }
.hp-fill.low      { background: linear-gradient(180deg, #ffff80, #ffc040 40%, #ff8040); }
.hp-fill.critical { background: linear-gradient(180deg, #ffa0a0, var(--red) 40%, var(--red-dark)); animation: pulse 0.6s infinite; }
.mp-fill          { background: linear-gradient(180deg, #80c0ff, var(--mp-blue) 40%, var(--mp-blue-dark)); }
@keyframes pulse  { 50%{filter:brightness(1.4)} }

/* Status strip */
.status-strip { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; }
.status-strip .stats-cell { display:flex; flex-direction:column; gap:3px; }
.bar-row { display:flex; align-items:center; gap:5px; }
.bar-row .lbl { font-size:8px; width:18px; color:var(--text-purple); flex-shrink:0; }
.bar-row .stat-track { flex:1; }
.bar-row .val { font-size:7px; color:var(--text-pale); min-width:48px; text-align:right; }
.turn-badge { text-align:center; font-size:7px; color:var(--text-purple); letter-spacing:2px; }
.turn-badge .num { display:block; padding:3px 8px; background:var(--win-bg); border:2px solid var(--gold); color:var(--yellow); font-size:11px; margin-top:2px; }
.player-name-line { font-size:9px; color:var(--yellow); letter-spacing:1px; margin-bottom:4px; text-shadow:1px 1px 0 #000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.player-meta-inline { font-size:7px; color:var(--text-purple); margin-left:4px; }

/* Command */
.cmd-grid { display:grid; grid-template-columns:1fr 1fr; gap:2px 8px; }
.cmd-item { display:flex; align-items:center; padding:10px 6px; min-height:44px; font-size:11px; color:#fff; cursor:pointer; background:transparent; border:none; font-family:inherit; text-align:left; letter-spacing:1px; }
.cmd-item:disabled { opacity:0.4; cursor:not-allowed; }
.cmd-item .arrow { color:var(--yellow); margin-right:6px; width:10px; opacity:0; }
.cmd-item.active { color:var(--yellow); }
.cmd-item.active .arrow { opacity:1; animation:blink 0.6s steps(1) infinite; }
@keyframes blink { 50%{opacity:0} }

/* Spell list */
.spell-list { max-height:156px; overflow-y:auto; scrollbar-width:thin; scrollbar-color:#4040c0 #000030; }
.spell-item { display:flex; align-items:center; padding:8px 6px; min-height:38px; cursor:pointer; font-size:10px; background:transparent; border:none; width:100%; color:#fff; font-family:inherit; text-align:left; letter-spacing:1px; }
.spell-item:disabled { opacity:0.4; cursor:not-allowed; }
.spell-item.active { color:var(--yellow); background:rgba(255,236,64,0.06); }
.spell-item .arrow { color:var(--yellow); margin-right:6px; width:10px; opacity:0; }
.spell-item.active .arrow { opacity:1; animation:blink 0.6s steps(1) infinite; }
.spell-item .cost { margin-left:auto; color:var(--mp-blue); font-size:8px; }
.spell-back { padding:8px 6px; font-size:9px; color:var(--text-purple); border-top:1px solid #2a2a80; margin-top:4px; cursor:pointer; background:transparent; border:none; width:100%; text-align:left; font-family:inherit; }
.spell-back:hover { color:var(--yellow); }
.spell-empty { font-size:9px; color:var(--text-purple); padding:12px 6px; letter-spacing:1px; }

/* Log — 4 lines */
.log-window { min-height:116px; max-height:116px; }
.log-text { font-size:10px; color:var(--text-pale); line-height:2; letter-spacing:1px; white-space:pre-wrap; overflow:hidden; }
.log-text > div { padding:1px 0; }
.log-text .ln-dmg    { color:var(--red); }
.log-text .ln-heal   { color:var(--hp-green); }
.log-text .ln-magic  { color:var(--mp-blue); }
.log-text .ln-system { color:var(--yellow); }

/* Screen effects */
.screen-flash { position:fixed; inset:0; pointer-events:none; z-index:50; opacity:0; }
.screen-flash.show { animation:screenFlash 0.25s; }
@keyframes screenFlash { 0%,100%{opacity:0} 40%{opacity:0.8} }
.screen-shake { animation:shake 0.3s; }
@keyframes shake { 0%,100%{transform:translate(0,0)} 20%{transform:translate(-3px,2px)} 40%{transform:translate(3px,-2px)} 60%{transform:translate(-2px,3px)} 80%{transform:translate(2px,-1px)} }

/* Result overlay */
.overlay { position:fixed; inset:0; background:rgba(0,0,16,0.85); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn 0.4s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.result-card { width:100%; max-width:460px; }
.result-title { text-align:center; font-size:22px; letter-spacing:6px; margin-bottom:16px; text-shadow:3px 3px 0 #000, 0 0 20px currentColor; animation:resultPop 0.5s ease-out; }
@keyframes resultPop { 0%{transform:scale(0.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
.result-title.victory { color:var(--yellow); }
.result-title.defeat  { color:var(--red); }
.result-title.flee    { color:var(--mp-blue); }
.reward-row { display:flex; justify-content:space-between; align-items:center; padding:8px 4px; font-size:10px; color:var(--text-pale); border-bottom:1px dotted #2a2a80; letter-spacing:1px; }
.reward-row .val { color:var(--yellow); font-size:12px; }
.level-up { text-align:center; margin:14px 0; padding:10px; background:linear-gradient(90deg, transparent, rgba(255,236,64,0.2), transparent); border-top:1px solid var(--gold); border-bottom:1px solid var(--gold); color:var(--yellow); font-size:12px; letter-spacing:3px; animation:levelGlow 1.2s ease-in-out infinite alternate; }
@keyframes levelGlow { from{text-shadow:0 0 4px var(--gold)} to{text-shadow:0 0 14px var(--gold), 0 0 24px var(--yellow)} }

/* Buttons */
.dq-btn { background:var(--win-bg); border:3px solid var(--border-gray); color:#fff; font-family:inherit; font-size:11px; padding:12px 20px; cursor:pointer; letter-spacing:1px; box-shadow:3px 3px 0 #000; min-height:44px; }
.dq-btn:hover { color:var(--yellow); border-color:var(--yellow); }
.dq-btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 #000; }

/* Loading */
.loading { text-align:center; padding:40px 20px; color:var(--text-purple); font-size:10px; letter-spacing:2px; animation:blink 1s steps(1) infinite; }
</style>
</head>
<body>
<div class="stars"></div>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ─── Audio ───────────────────────────────────────────────────────
let audioCtx = null;
const A = () => (audioCtx ||= new (window.AudioContext || window.webkitAudioContext)());
function beep(freq=440, dur=0.08, type='square', vol=0.12) {
  try {
    const c = A(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = type; o.frequency.setValueAtTime(freq, c.currentTime);
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.start(); o.stop(c.currentTime + dur);
  } catch(e) {}
}
const sfx = {
  cursor:  () => beep(800, 0.04, 'square', 0.08),
  select:  () => { beep(1000, 0.05); beep(1400, 0.08); },
  attack:  () => { beep(200, 0.05, 'sawtooth', 0.2); setTimeout(() => beep(140, 0.1, 'sawtooth', 0.2), 30); },
  hit:     () => { beep(80, 0.1, 'sawtooth', 0.25); beep(120, 0.08, 'square', 0.15); },
  magic:   () => { [400,600,800,1200].forEach((f,i) => setTimeout(() => beep(f, 0.1, 'triangle', 0.15), i*40)); },
  heal:    () => { [600,800,1000,1200].forEach((f,i) => setTimeout(() => beep(f, 0.12, 'sine', 0.2), i*60)); },
  defend:  () => beep(300, 0.15, 'triangle', 0.2),
  flee:    () => { [400,300,200,150].forEach((f,i) => setTimeout(() => beep(f, 0.08, 'square', 0.12), i*40)); },
  victory: () => [523,659,784,1047,1319].forEach((f,i) => setTimeout(() => beep(f, 0.2, 'square', 0.2), i*150)),
  defeat:  () => [400,300,200,150,100].forEach((f,i) => setTimeout(() => beep(f, 0.3, 'sawtooth', 0.15), i*200)),
  levelUp: () => [523,659,784,1047,784,1047,1319].forEach((f,i) => setTimeout(() => beep(f, 0.15, 'square', 0.2), i*120)),
};

// ─── Constants ───────────────────────────────────────────────────
const BG_MAP = {
  slime:    { bg: 'bg-grass',      ground: 'grass' },
  beast:    { bg: 'bg-forest',     ground: 'dirt'  },
  undead:   { bg: 'bg-graveyard',  ground: 'bone'  },
  humanoid: { bg: 'bg-castle',     ground: 'stone' },
  dragon:   { bg: 'bg-lava',       ground: 'lava'  },
};

const CAT_MAP = {
  'スライム系': 'slime',
  '魔獣系':     'beast',
  '不死系':     'undead',
  'ドラゴン系': 'dragon',
  '人型':       'humanoid',
};

const ELEMENT_TYPE_MAP = {
  '炎': 'fire', '氷': 'ice', '雷': 'bolt',
  '光': 'heal', '闇': 'ice', '補助': 'buff',
};

const CLASS_PARTS = {
  'せんし':       { head:'warrior',  body:'chain-armor',  rarm:'iron-sword',   larm:'iron-shield',  legs:'warrior'  },
  'まほうつかい': { head:'mage',     body:'default',      rarm:'wood-stick',   larm:'default',      legs:'mage'     },

  'wood-stick':   { atk:5 },
  'copper-sword': { atk:15 },
  'iron-sword':   { atk:25 },
  'flame-sword':  { atk:40, hp:10 },

  'wood-shield':  { def:5 },
  'iron-shield':  { def:15 },

// ─── Helpers ─────────────────────────────────────────────────────
const rng = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const wait = (ms) => new Promise(r => setTimeout(r, ms));

function calcEquipBonus(equip) {
  const bonus = { atk:0, def:0, hp:0, mp:0 };
  ['weapon','shield','armor','accessory'].forEach(slot => {
    const b = EQUIPMENT_BONUS[equip[slot]] || {};
    bonus.atk += b.atk || 0;
    bonus.def += b.def || 0;
    bonus.hp  += b.hp  || 0;
    bonus.mp  += b.mp  || 0;
  });
  return bonus;
}

function MonsterSprite({ id, state }) {
  const svg = window.DQ_ICONS?.monsters?.[id] || '';

function PlayerSprite({ parts }) {
  const P = window.DQ_PARTS;

  const rects =
    (P.heads[parts.head]      || P.heads.other    || '') +
    (P.bodies[parts.body]     || P.bodies.default  || '') +
    (P.rightArms[parts.rarm]  || P.rightArms.default || '') +
    (P.leftArms[parts.larm]   || P.leftArms.default  || '') +
    (P.legs[parts.legs]       || P.legs.other     || '');

    <svg className="player-sprite" width="96" height="128" viewBox="0 0 12 16"

  const pct = (current / max) * 100;

  return (
    <div className="bar-row">
      <span className="lbl">{label}</span>

      <span className="val">{current}/{max}</span>
    </div>
  );
}
function MpBar({ current, max }) {

// ─── Main App ─────────────────────────────────────────────────────
function App() {
  // ─ Load from localStorage (synchronous)
  const charData = useMemo(() => {
    try { return JSON.parse(localStorage.getItem('codequest:save.character') || 'null'); } catch { return null; }
  }, []);
  const equipData = useMemo(() => {
    try { return JSON.parse(localStorage.getItem('codequest:save.equipment') || '{}'); } catch { return {}; }
  }, []);
  const charParts = useMemo(() => {
    if (!charData) return CLASS_PARTS['せんし'];
    const p = { ...(CLASS_PARTS[charData.cls.label] || CLASS_PARTS['せんし']) };
    if (equipData.weapon) p.rarm = equipData.weapon;
    if (equipData.shield) p.larm = equipData.shield;
    if (equipData.armor)  p.body = equipData.armor;
    return p;
  }, [charData, equipData]);

  const [player, setPlayer] = useState(() => {
    if (!charData) return { name:'???', cls:'せんし', lv:1, hp:30, maxHp:30, mp:10, maxMp:10, atk:5, def:3, gold:0, xp:0 };
    const bonus = calcEquipBonus(equipData);
    const maxHp = (charData.cls.stats.守備 || 0) * 2 + (bonus.hp || 0) + 20;
    const maxMp = (charData.cls.stats.魔力 || 0) * 2 + (bonus.mp || 0) + 10;
    return {
      name:   charData.name,
      cls:    charData.cls.label,
      lv:     charData.lv  || 1,
      hp:     maxHp, maxHp,
      mp:     maxMp, maxMp,
      atk:    (charData.cls.stats.力     || 5) + (bonus.atk || 0),
      def:    (charData.cls.stats.守備   || 3) + (bonus.def || 0),
      gold:   charData.gold || 0,
      xp:     charData.xp  || 0,
    };
  });

  const [monster,       setMonster]       = useState(null);
  const [spells,        setSpells]        = useState([]);
  const [mode,          setMode]          = useState('command');
  const [cursor,        setCursor]        = useState(0);
  const [monsterState,  setMonsterState]  = useState('idle');
  const [playerAction,  setPlayerAction]  = useState('idle');
  const [magicFx,       setMagicFx]       = useState(null);
  const [magicCircle,   setMagicCircle]   = useState(null);
  const [showShield,    setShowShield]    = useState(false);
  const [particles,     setParticles]     = useState([]);
  const [popups,        setPopups]        = useState([]);
  const [log,           setLog]           = useState([]);
  const [defending,     setDefending]     = useState(false);
  const [result,        setResult]        = useState(null);
  const [shake,         setShake]         = useState(false);
  const [flash,         setFlash]         = useState(null);
  const [turn,          setTurn]          = useState(1);
  const fieldRef    = useRef(null);
  const popupId     = useRef(1);
  const logId       = useRef(1);
  const particleId  = useRef(1);

  // ─ Redirect if no character
  useEffect(() => {
    if (!charData) { location.href = 'index.html'; }
  }, [charData]);

  // ─ Load monster from monsters.json
  useEffect(() => {
    const q = new URLSearchParams(location.search);
    const monsterId = q.get('monster');
    fetch('monsters.json')
      .then(r => r.json())
      .then(data => {
        const found = monsterId ? data.find(x => x.id === monsterId) : null;
        const m = found || data[Math.floor(Math.random() * data.length)];
        const cat = CAT_MAP[m.type] || 'beast';
        setMonster({
          ...m,
          lv:     m.level || m.lv || 1,
          maxHp:  m.hp,
          cat,
          xp:     m.xp    !== undefined ? m.xp    : (m.level || 1) * 10,
          gold:   m.gold  !== undefined ? m.gold  : (m.level || 1) * 15,
          boss:   m.id === 'dragon-lord',
        });
        logId.current = 1;
        setLog([{ id: 0, text: `${m.name}が あらわれた！`, kind: 'system' }]);
      })
      .catch(() => {});
  }, []);

  // ─ Load spells from spells.json + character.spells
  useEffect(() => {
    const learnedIds = (() => {
      try { return JSON.parse(localStorage.getItem('codequest:save.character.spells') || '[]'); } catch { return []; }
    })();
    fetch('spells.json')
      .then(r => r.json())
      .then(data => {
        const learned = data
          .filter(s => learnedIds.includes(s.id))
          .map(s => ({
            id:   s.id,
            name: s.name,
            cost: s.mpCost,
            pow:  s.power,
            type: s.category === 'heal' ? 'heal' : (ELEMENT_TYPE_MAP[s.element] || 'fire'),
            desc: s.description,
          }));
        setSpells(learned);
      })
      .catch(() => setSpells([]));
  }, []);

  const addLog = useCallback((text, kind='normal') => {
    setLog(prev => [...prev, { id: logId.current++, text, kind }]);
  }, []);

  const spawnPopup = (text, side='monster', kind='') => {
    if (!fieldRef.current) return;
    const rect = fieldRef.current.getBoundingClientRect();
    const x = (side==='monster' ? rect.width*0.24 : rect.width*0.74) + rng(-20, 20);
    const y = rect.height * 0.35 + rng(-10, 10);
    const id = popupId.current++;
    setPopups(prev => [...prev, { id, text, kind, x, y }]);
    setTimeout(() => setPopups(prev => prev.filter(p => p.id !== id)), 900);
  };

  const spawnParticles = (type, side='monster', count=12) => {
    if (!fieldRef.current) return;
    const rect = fieldRef.current.getBoundingClientRect();
    const cx = (side==='monster' ? rect.width*0.24 : rect.width*0.74);
    const cy = rect.height * 0.5;
    const ps = [];
    for (let i = 0; i < count; i++) {
      const ang = (Math.PI*2*i)/count + Math.random()*0.3;
      ps.push({ id: particleId.current++, type, x:cx, y:cy,
        dx: Math.cos(ang)*(40+Math.random()*30), dy: Math.sin(ang)*(40+Math.random()*30) });
    }
    setParticles(prev => [...prev, ...ps]);
    setTimeout(() => { setParticles(prev => prev.filter(p => !ps.find(x => x.id===p.id))); }, 900);
  };

  const doFlash = (color='rgba(255,255,255,0.7)') => {
    setFlash(color); setTimeout(() => setFlash(null), 250);
  };
  const doShake = () => { setShake(true); setTimeout(() => setShake(false), 300); };

  // ─ Save progress to localStorage
  const saveProgress = useCallback((lv, xp, gold, defeatedMonsterId) => {
    const stored = (() => { try { return JSON.parse(localStorage.getItem('codequest:save.character') || 'null'); } catch { return null; } })();
    if (!stored) return;
    localStorage.setItem('codequest:save.character', JSON.stringify({ ...stored, lv, xp, gold }));
    if (defeatedMonsterId) {
      const b = (() => { try { return JSON.parse(localStorage.getItem('codequest:save.bestiary') || '{"defeatedMonsterIds":[]}'); } catch { return {defeatedMonsterIds:[]}; } })();
      if (!b.defeatedMonsterIds.includes(defeatedMonsterId)) b.defeatedMonsterIds.push(defeatedMonsterId);
      localStorage.setItem('codequest:save.bestiary', JSON.stringify(b));
    }
  }, []);

  const recalcSpells = useCallback((newLv) => {
    fetch('spells.json')
      .then(r => r.json())
      .then(data => {
        const learned = data.filter(s => s.requiredLevel <= newLv).map(s => s.id);
        localStorage.setItem('codequest:save.character.spells', JSON.stringify(learned));
      })
      .catch(() => {});
  }, []);

  // ─── Actions ─────────────────────────────────────────────────────
  const playerAttack = async () => {
    if (!monster) return;
    setMode('wait'); setPlayerAction('attack');
    addLog(`${player.name}のこうげき！`);
    sfx.attack();
    await wait(450);
    const crit = Math.random() < 0.1;
    const dmg = Math.max(1, player.atk - monster.def + rng(-3, 3));
    const finalDmg = crit ? Math.floor(dmg * 1.6) : dmg;
    sfx.hit();
    setMonsterState('hit'); doFlash('rgba(255,255,255,0.5)');
    spawnPopup(finalDmg, 'monster', crit ? 'crit' : '');
    addLog(`${monster.name}に ${finalDmg} のダメージ！${crit ? ' かいしんのいちげき！' : ''}`, 'dmg');
    const newHp = clamp(monster.hp - finalDmg, 0, monster.maxHp);
    setMonster(m => ({...m, hp: newHp}));
    await wait(400); setMonsterState('idle'); setPlayerAction('idle');
    await wait(150);
    if (newHp <= 0) await monsterDefeated(newHp);
    else { await wait(300); monsterTurn(); }
  };

  const playerSpell = async (spellIdx) => {
    if (!monster) return;
    const s = spells[spellIdx];
    if (!s || player.mp < s.cost) return;
    setMode('wait'); setPlayerAction('magic');
    setPlayer(p => ({...p, mp: p.mp - s.cost}));
    addLog(`${player.name}は ${s.name} をとなえた！`, 'magic');
    sfx.magic();
    setMagicCircle(s.type);
    const pType = s.type==='ice' ? 'ice' : s.type==='bolt' ? 'bolt' : 'fire';
    spawnParticles(pType, 'player', 14);
    await wait(700); setMagicCircle(null);

    if (s.type === 'heal') {
      const healed = Math.max(1, s.pow + rng(-3, 3));
      sfx.heal(); setMagicFx('heal');
      setPlayer(p => ({...p, hp: clamp(p.hp + healed, 0, p.maxHp)}));
      spawnPopup('+' + healed, 'player', 'heal');
      addLog(`HPが ${healed} かいふくした！`, 'heal');
      await wait(500); setMagicFx(null); setPlayerAction('idle');
      await wait(150); monsterTurn();
    } else {
      const dmg = Math.max(1, s.pow + rng(-3, 3));
      sfx.hit(); doShake();
      const flashColor = s.type==='ice' ? 'rgba(120,200,255,0.5)' : s.type==='bolt' ? 'rgba(255,240,100,0.5)' : 'rgba(255,80,40,0.5)';
      doFlash(flashColor);
      setMonsterState('hit'); setMagicFx(s.type);
      spawnParticles(pType, 'monster', 16);
      spawnPopup(dmg, 'monster', 'crit');
      addLog(`${monster.name}に ${dmg} のダメージ！`, 'dmg');
      const newHp = clamp(monster.hp - dmg, 0, monster.maxHp);
      setMonster(m => ({...m, hp: newHp}));
      await wait(600); setMagicFx(null); setMonsterState('idle'); setPlayerAction('idle');
      await wait(150);
      if (newHp <= 0) await monsterDefeated(newHp);
      else { await wait(200); monsterTurn(); }
    }
  };

  const playerDefend = async () => {
    setMode('wait'); setPlayerAction('defend'); setShowShield(true);
    sfx.defend();
    addLog(`${player.name}は みをまもっている！`, 'system');
    setDefending(true);
    await wait(700); monsterTurn();
  };

  const playerFlee = async () => {
    if (!monster) return;
    setMode('wait'); setPlayerAction('flee');
    sfx.flee();
    addLog(`${player.name}は にげだした！`);
    await wait(600);
    if (Math.random() < 0.5 && !monster.boss) {
      addLog('うまく にげきれた！', 'system');
      await wait(500);
      setResult({ type:'flee', monster });
      setMode('result');
    } else {
      addLog(monster.boss ? 'ボスからは にげられない！' : 'しかし まわりこまれてしまった！', 'system');
      setPlayerAction('idle');
      await wait(500); monsterTurn();
    }
  };

  const monsterTurn = async () => {
    if (!monster) return;
    await wait(250);
    addLog(`${monster.name}のこうげき！`);
    sfx.attack(); setMonsterState('attacking');
    await wait(450);
    let dmg = Math.max(1, monster.atk - player.def + rng(-2, 2));
    if (defending) dmg = Math.floor(dmg / 2);
    sfx.hit();
    if (!defending) setPlayerAction('hit');
    doShake(); doFlash('rgba(255,40,40,0.5)');
    spawnPopup(dmg, 'player');
    addLog(`${player.name}は ${dmg} ダメージをうけた！${defending ? ' (ぼうぎょで半減)' : ''}`, 'dmg');
    setPlayer(p => {
      const newHp = clamp(p.hp - dmg, 0, p.maxHp);
      return {...p, hp: newHp};
    });
    setDefending(false); setShowShield(false);
    await wait(500); setMonsterState('idle'); setPlayerAction('idle');
    await wait(200);
    setPlayer(p => {
      if (p.hp <= 0) { playerDefeated(p); }
      return p;
    });
    setPlayer(p => {
      if (p.hp > 0) {
        setTurn(t => t + 1);
        setMode('command');
        setCursor(0);
      }
      return p;
    });
  };

  const monsterDefeated = async () => {
    if (!monster) return;
    sfx.victory(); setMonsterState('dying');
    addLog(`${monster.name}を たおした！`, 'system');
    await wait(900); setMonster(m => ({...m, hp:0})); await wait(300);
    addLog(`けいけんち ${monster.xp} ポイント かくとく！`, 'system');
    addLog(`${monster.gold} ゴールドを てにいれた！`, 'system');
    setPlayer(p => {
      const newXp   = p.xp + monster.xp;
      const levelUp = newXp >= p.lv * 25;
      const newLv   = levelUp ? p.lv + 1 : p.lv;
      const newGold = p.gold + monster.gold;
      if (levelUp) { sfx.levelUp(); addLog(`${p.name}はレベルが上がった！`, 'system'); }
      saveProgress(newLv, newXp, newGold, monster.id);
      if (levelUp) recalcSpells(newLv);
      setTimeout(async () => {
        await wait(700);
        setResult({ type:'victory', monster, xp:monster.xp, gold:monster.gold, levelUp });
        setMode('result');
      }, 0);
      return { ...p, xp:newXp, gold:newGold, lv:newLv };
    });
  };

  const playerDefeated = async (p) => {
    sfx.defeat();
    addLog(`${(p||player).name}は しんでしまった…`, 'dmg');
    await wait(1200);
    setPlayer(prev => {
      const lost    = Math.floor(prev.gold / 10);
      const newGold = Math.max(0, prev.gold - lost);
      saveProgress(prev.lv, prev.xp, newGold, null);
      setResult({ type:'defeat', monster, lostGold:lost });
      setMode('result');
      return { ...prev, gold:newGold };
    });
  };

  const handleCommand = (i) => {
    sfx.select();
    if (i===0) playerAttack();
    else if (i===1) { setMode('spell'); setCursor(0); }
    else if (i===2) playerDefend();
    else if (i===3) playerFlee();
  };
  const handleSpell = (i) => {
    if (i < 0) { sfx.cursor(); setMode('command'); setCursor(1); return; }
    sfx.select(); playerSpell(i);
  };

  if (!charData) return null;

  return (
    <>
      {flash && <div className="screen-flash show" style={{background:flash}}/>}
      <div className={`battle-app ${shake?'screen-shake':''}`}>
        <Field
          monster={monster} player={player} charParts={charParts}
          monsterState={monsterState} playerAction={playerAction}
          magicFx={magicFx} magicCircle={magicCircle}
          showShield={showShield} particles={particles} popups={popups}
          fieldRef={fieldRef}
        />
        <StatusStrip player={player} turn={turn}/>
        {mode !== 'result' && monster && (
          <CommandWindow
            mode={mode} cursor={cursor}
            setCursor={(c) => { sfx.cursor(); setCursor(c); }}
            onChoose={mode==='spell' ? handleSpell : handleCommand}
            player={player} spells={spells}
          />
        )}
        {!monster && <div className="dq-window"><div className="dq-window-inner loading">よみこみちゅう…</div></div>}
        <LogWindow lines={log}/>
      </div>
      {result && <ResultOverlay result={result} onBack={() => location.href='board.html'}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
