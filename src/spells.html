<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冒険者ギルド まほうの まきもの</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000810;
    font-family: 'Press Start 2P', monospace;
    color: #fff;
    overflow-x: hidden;
  }
  .stars {
    position: fixed; inset: 0;
    background:
      radial-gradient(1px 1px at 10% 15%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 70%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 30%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 80%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 20%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 50%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 60%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 45%, #fff 0%, transparent 100%);
    pointer-events: none; z-index: 0;
  }
  .dq-window {
    background: #000060;
    border: 4px solid #c8c8c8;
    outline: 4px solid #000060;
    box-shadow: inset 0 0 0 2px #ffffff, 0 0 0 2px #000, 6px 6px 0 #000;
    image-rendering: pixelated;
    position: relative;
  }
  .dq-window::before {
    content: ''; position: absolute; inset: 3px;
    border: 2px solid #4848b8; pointer-events: none;
  }
  .dq-title-bar {
    background: #000060;
    border-bottom: 2px solid #c8c8c8;
    padding: 10px 16px;
    text-align: center;
    letter-spacing: 2px;
    font-size: 11px;
    color: #ffec40;
    text-shadow: 2px 2px #000;
  }
  .dq-content { padding: 20px; }
  .dq-btn {
    background: #000060;
    border: 3px solid #c8c8c8;
    outline: 2px solid #000;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    padding: 12px 28px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.05s;
    box-shadow: 3px 3px 0 #000;
  }
  .dq-btn:hover { background: #2020a0; color: #ffec40; border-color: #ffec40; }
  .dq-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
  .monster-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid #1a1a60;
    transition: background 0.1s;
    cursor: pointer;
  }
  .monster-row:hover { background: #0a0a40; }
  .filter-btn {
    background: #000030;
    border: 2px solid #303080;
    color: #6060a0;
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    padding: 5px 8px;
    cursor: pointer;
    transition: all 0.1s;
  }
  .filter-btn.active { border-color: #ffec40; color: #ffec40; background: #001040; }
  /* spell-row: monster-row に準拠 */
  .spell-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid #1a1a60;
    transition: background 0.1s;
    cursor: pointer;
  }
  .spell-row:hover { background: #0a0a40; }
  .spell-row.locked { opacity: 0.5; }
  .spell-icon { font-size: 20px; width: 28px; text-align: center; flex-shrink: 0; padding-top: 2px; }
  .spell-info { flex: 1; min-width: 0; }
  .spell-name { font-size: 10px; margin-bottom: 4px; }
  .spell-name.learned { color: #ffec40; }
  .spell-name.locked-name { color: #505070; }
  .spell-desc { font-size: 7px; color: #606090; margin-top: 5px; line-height: 1.8; }
  .spell-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px; }
  .meta-chip {
    font-size: 7px; color: #a0c0ff;
    background: #00002a;
    border: 1px solid #2a2a60;
    padding: 2px 5px;
  }
  .category-badge {
    font-size: 7px;
    padding: 2px 6px;
    border: 1px solid;
    flex-shrink: 0;
  }
  .category-badge.attack { color: #ff4040; border-color: #601010; background: #200000; }
  .category-badge.heal   { color: #40ff80; border-color: #105030; background: #002010; }
  .category-badge.buff   { color: #4080ff; border-color: #102050; background: #000820; }
  .learned-badge {
    font-size: 8px; color: #40ff80;
    border: 1px solid #204040;
    background: #002020;
    padding: 3px 7px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .locked-badge {
    font-size: 7px; color: #505070;
    border: 1px solid #202040;
    padding: 3px 6px;
    flex-shrink: 0;
    white-space: nowrap;
    line-height: 1.6;
    text-align: center;
  }
  .lv-badge {
    font-size: 8px;
    color: #ffd700;
    flex-shrink: 0;
    width: 30px;
    text-align: right;
  }
  .element-section-header {
    font-size: 8px;
    padding: 8px 14px 6px;
    letter-spacing: 2px;
    border-bottom: 1px solid #1a1a60;
    background: #00001a;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .fade-in { animation: fadeIn 0.3s ease-out both; }
  /* Focus highlight */
  :focus-visible { outline: 3px solid #ffec40; outline-offset: 2px; }
  .dq-btn:focus-visible { outline: 3px solid #ffec40; outline-offset: 3px; box-shadow: 3px 3px 0 #000, 0 0 8px rgba(255,236,64,0.5); }
  .filter-btn:focus-visible { outline: 2px solid #ffec40; outline-offset: 2px; }
  .spell-row:focus-visible { outline: 2px solid #ffec40; outline-offset: -2px; }
  /* Press interaction */
  .dq-btn, .filter-btn, .spell-row { user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .dq-btn.pressing { background: #2020a0; color: #ffec40; border-color: #ffec40; transform: translate(2px,2px); box-shadow: 1px 1px 0 #000; }
  .filter-btn.pressing { border-color: #ffec40; color: #ffec40; background: #001040; }
  .spell-row.pressing { background: #0a0a40; }
  @media (max-width: 520px) {
    .dq-content { padding: 14px; }
    .dq-btn { min-height: 44px; font-size: 9px; }
    .dq-title-bar { font-size: 9px; padding: 8px 12px; }
    .spell-row { padding: 10px; gap: 8px; }
    .spell-meta { gap: 4px; }
  }
</style>
</head>
<body>
<div class="stars"></div>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

// ─── Audio ───────────────────────────────────────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function getAudio() { if (!audioCtx) audioCtx = new AudioCtx(); return audioCtx; }
function beep(freq=440, dur=0.08, type='square', vol=0.15) {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch(e) {}
}
function cursorSound() { beep(800, 0.05, 'square', 0.1); }
function selectSound() { beep(1200, 0.1, 'square', 0.15); beep(1500, 0.1, 'square', 0.15); }

// ─── DQ Window ──────────────────────────────────────────────────
function DQWindow({ title, children, style }) {
  return (
    <div className="dq-window" style={style}>
      {title && <div className="dq-title-bar">{title}</div>}
      <div className="dq-content">{children}</div>
    </div>
  );
}

// ─── 定数 ────────────────────────────────────────────────────────
const CHAR_KEY   = 'codequest:save.character';
const SPELLS_KEY = 'codequest:save.character.spells';

const ELEMENT_ORDER = ['炎', '氷', '雷', '光', '闇', '補助'];
const ELEMENT_META = {
  '炎': { icon: `<svg width="24" height="24" viewBox="0 0 12 12" style="image-rendering:pixelated;" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="5" y="1" width="2" height="1" fill="#ffff40"/><rect x="4" y="2" width="4" height="1" fill="#ff8040"/><rect x="3" y="3" width="6" height="1" fill="#ff6030"/><rect x="2" y="4" width="8" height="2" fill="#ff4030"/><rect x="2" y="6" width="8" height="3" fill="#ff6030"/><rect x="3" y="9" width="6" height="1" fill="#ff4030"/><rect x="4" y="10" width="4" height="1" fill="#c02020"/><rect x="4" y="4" width="4" height="3" fill="#ffff40"/><rect x="5" y="5" width="2" height="2" fill="#ffffff"/><rect x="8" y="2" width="1" height="1" fill="#ff8040"/><rect x="3" y="2" width="1" height="1" fill="#ff8040"/><rect x="1" y="5" width="1" height="1" fill="#ff4030"/><rect x="10" y="5" width="1" height="1" fill="#ff4030"/></svg>`, color: '#ff6030' },
  '氷': { icon: `<svg width="24" height="24" viewBox="0 0 12 12" style="image-rendering:pixelated;" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="5" y="1" width="2" height="10" fill="#80d0ff"/><rect x="1" y="5" width="10" height="2" fill="#80d0ff"/><rect x="2" y="2" width="1" height="1" fill="#80d0ff"/><rect x="3" y="3" width="1" height="1" fill="#80d0ff"/><rect x="8" y="3" width="1" height="1" fill="#80d0ff"/><rect x="9" y="2" width="1" height="1" fill="#80d0ff"/><rect x="2" y="9" width="1" height="1" fill="#80d0ff"/><rect x="3" y="8" width="1" height="1" fill="#80d0ff"/><rect x="8" y="8" width="1" height="1" fill="#80d0ff"/><rect x="9" y="9" width="1" height="1" fill="#80d0ff"/><rect x="4" y="1" width="1" height="1" fill="#ffffff"/><rect x="7" y="1" width="1" height="1" fill="#ffffff"/><rect x="4" y="10" width="1" height="1" fill="#ffffff"/><rect x="7" y="10" width="1" height="1" fill="#ffffff"/><rect x="1" y="4" width="1" height="1" fill="#ffffff"/><rect x="1" y="7" width="1" height="1" fill="#ffffff"/><rect x="10" y="4" width="1" height="1" fill="#ffffff"/><rect x="10" y="7" width="1" height="1" fill="#ffffff"/><rect x="5" y="5" width="2" height="2" fill="#ffffff"/></svg>`, color: '#80d0ff' },
  '雷': { icon: `<svg width="24" height="24" viewBox="0 0 12 12" style="image-rendering:pixelated;" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="6" y="1" width="3" height="1" fill="#ffffff"/><rect x="5" y="2" width="3" height="1" fill="#ffff40"/><rect x="4" y="3" width="3" height="1" fill="#ffff40"/><rect x="3" y="4" width="3" height="1" fill="#ffff40"/><rect x="3" y="5" width="5" height="1" fill="#ffff40"/><rect x="6" y="5" width="2" height="1" fill="#ffffff"/><rect x="5" y="6" width="2" height="1" fill="#ffff40"/><rect x="4" y="7" width="2" height="1" fill="#ffff40"/><rect x="3" y="8" width="2" height="1" fill="#ffff40"/><rect x="2" y="9" width="2" height="1" fill="#c0a020"/><rect x="2" y="10" width="1" height="1" fill="#c0a020"/><rect x="6" y="2" width="1" height="1" fill="#ffffff"/><rect x="4" y="4" width="1" height="1" fill="#ffffff"/><rect x="9" y="4" width="1" height="1" fill="#ffff40"/><rect x="1" y="7" width="1" height="1" fill="#ffff40"/></svg>`, color: '#ffff40' },
  '光': { icon: `<svg width="24" height="24" viewBox="0 0 12 12" style="image-rendering:pixelated;" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="5" y="0" width="2" height="12" fill="#ffffc0"/><rect x="5" y="1" width="2" height="10" fill="#ffff80"/><rect x="0" y="5" width="12" height="2" fill="#ffffc0"/><rect x="1" y="5" width="10" height="2" fill="#ffff80"/><rect x="4" y="4" width="4" height="4" fill="#ffffff"/><rect x="3" y="5" width="6" height="2" fill="#ffffff"/><rect x="5" y="3" width="2" height="6" fill="#ffffff"/><rect x="2" y="2" width="1" height="1" fill="#ffd700"/><rect x="9" y="2" width="1" height="1" fill="#ffd700"/><rect x="2" y="9" width="1" height="1" fill="#ffd700"/><rect x="9" y="9" width="1" height="1" fill="#ffd700"/><rect x="3" y="3" width="1" height="1" fill="#ffff80"/><rect x="8" y="3" width="1" height="1" fill="#ffff80"/><rect x="3" y="8" width="1" height="1" fill="#ffff80"/><rect x="8" y="8" width="1" height="1" fill="#ffff80"/></svg>`, color: '#ffffc0' },
  '闇': { icon: `<svg width="24" height="24" viewBox="0 0 12 12" style="image-rendering:pixelated;" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="4" y="1" width="4" height="1" fill="#6020c0"/><rect x="3" y="2" width="6" height="1" fill="#6020c0"/><rect x="2" y="3" width="8" height="6" fill="#6020c0"/><rect x="3" y="9" width="6" height="1" fill="#6020c0"/><rect x="4" y="10" width="4" height="1" fill="#6020c0"/><rect x="3" y="3" width="6" height="6" fill="#8040ff"/><rect x="4" y="4" width="4" height="4" fill="#4010a0"/><rect x="5" y="5" width="2" height="2" fill="#000010"/><rect x="1" y="4" width="1" height="1" fill="#8040ff"/><rect x="10" y="4" width="1" height="1" fill="#8040ff"/><rect x="1" y="7" width="1" height="1" fill="#6020c0"/><rect x="10" y="7" width="1" height="1" fill="#6020c0"/><rect x="2" y="2" width="1" height="1" fill="#a060ff"/><rect x="9" y="9" width="1" height="1" fill="#a060ff"/></svg>`, color: '#8040ff' },
  '補助': { icon: `<svg width="24" height="24" viewBox="0 0 12 12" style="image-rendering:pixelated;" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="4" y="1" width="4" height="1" fill="#80ff80"/><rect x="3" y="2" width="6" height="1" fill="#80ff80"/><rect x="2" y="3" width="8" height="5" fill="#40c040"/><rect x="3" y="8" width="6" height="1" fill="#40c040"/><rect x="4" y="9" width="4" height="1" fill="#208020"/><rect x="5" y="10" width="2" height="1" fill="#208020"/><rect x="3" y="3" width="6" height="4" fill="#80ff80"/><rect x="4" y="4" width="4" height="2" fill="#a0ffa0"/><rect x="5" y="3" width="2" height="5" fill="#ffffff"/><rect x="3" y="4" width="6" height="2" fill="#ffffff"/><rect x="3" y="3" width="1" height="1" fill="#ffffff"/></svg>`, color: '#80ff80' },
};

const CATEGORY_LABEL = { attack: 'こうげき', heal: 'かいふく', buff: 'バフ' };

// ─── localStorage ────────────────────────────────────────────────
function loadCharacter() {
  try {
    const raw = localStorage.getItem(CHAR_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}
function calcLearnedIds(spells, lv) {
  return spells.filter(s => lv >= s.requiredLevel).map(s => s.id);
}
function saveLearnedIds(ids) {
  try { localStorage.setItem(SPELLS_KEY, JSON.stringify(ids)); } catch(e) {}
}

// ─── SpellSection ────────────────────────────────────────────────
function SpellSection({ element, spells, learnedIds }) {
  const meta = ELEMENT_META[element] || { icon: '✦', color: '#ffffff' };
  return (
    <div>
      <div className="element-section-header" style={{ color: meta.color }}>
        <span dangerouslySetInnerHTML={{ __html: meta.icon }} style={{ display: 'inline-block', lineHeight: 0, verticalAlign: 'middle', marginRight: 4 }} />　{element}
      </div>
      {spells.map((spell, i) => {
        const learned = learnedIds.includes(spell.id);
        return (
          <div
            key={spell.id}
            className={`spell-row fade-in${learned ? '' : ' locked'}`}
            style={{ animationDelay: i * 0.03 + 's' }}
            onClick={cursorSound}
          >
            <span className="spell-icon" dangerouslySetInnerHTML={{ __html: meta.icon }} style={{ display: 'inline-block', lineHeight: 0 }} />
            <div className="spell-info">
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
                <span className={`spell-name${learned ? ' learned' : ' locked-name'}`}>
                  {spell.name}
                </span>
                <span className={`category-badge ${spell.category}`}>
                  {CATEGORY_LABEL[spell.category] || spell.category}
                </span>
              </div>
              {learned && (
                <div className="spell-desc">{spell.description}</div>
              )}
              {learned && (
                <div className="spell-meta">
                  <span className="meta-chip">MP {spell.mpCost}</span>
                  {spell.power > 0 && <span className="meta-chip">いりょく {spell.power}</span>}
                  <span className="meta-chip">{spell.targetScope === 'enemy' ? 'てき1たい' : spell.targetScope === 'all_enemies' ? 'てき全体' : spell.targetScope === 'self' ? 'じぶん' : spell.targetScope === 'all_allies' ? 'みかた全体' : spell.targetScope}</span>
                </div>
              )}
            </div>
            <span className="lv-badge">Lv{spell.requiredLevel}</span>
            {learned
              ? <span className="learned-badge">しゅうとく</span>
              : <span className="locked-badge">Lv{spell.requiredLevel}<br/>で習得</span>
            }
          </div>
        );
      })}
    </div>
  );
}

// ─── SpellList ───────────────────────────────────────────────────
function SpellList({ spells, learnedIds, filter }) {
  const filtered = filter === 'all'
    ? spells
    : spells.filter(s => s.category === filter);

  if (filtered.length === 0) {
    return (
      <div style={{ textAlign: 'center', padding: '30px 0', color: '#404070', fontSize: 9, lineHeight: 2.5 }}>
        がいとうするまほうがありません
      </div>
    );
  }

  // 属性順にグループ分け
  const grouped = ELEMENT_ORDER.reduce((acc, el) => {
    const group = filtered.filter(s => s.element === el);
    if (group.length > 0) acc[el] = group;
    return acc;
  }, {});

  return (
    <div>
      {Object.entries(grouped).map(([el, group]) => (
        <SpellSection key={el} element={el} spells={group} learnedIds={learnedIds} />
      ))}
    </div>
  );
}

// ─── Main App ────────────────────────────────────────────────────
function App() {
  const [spells, setSpells]       = useState([]);
  const [character, setCharacter] = useState(null);
  const [learnedIds, setLearnedIds] = useState([]);
  const [filter, setFilter]       = useState('all');
  const [loading, setLoading]     = useState(true);

  // プレスハイライト
  useEffect(() => {
    const sel = '.dq-btn, .filter-btn, .spell-row';
    function onDown(e) {
      const t = e.target.closest(sel);
      if (!t) return;
      t.classList.add('pressing');
      t.addEventListener('mouseleave', () => t.classList.remove('pressing'), { once: true });
    }
    function onUp() { document.querySelectorAll('.pressing').forEach(el => el.classList.remove('pressing')); }
    function onMenu(e) { if (e.target.closest(sel)) e.preventDefault(); }
    document.addEventListener('mousedown', onDown);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchstart', onDown, { passive: true });
    document.addEventListener('touchend', onUp);
    document.addEventListener('touchcancel', onUp);
    document.addEventListener('contextmenu', onMenu);
    return () => {
      document.removeEventListener('mousedown', onDown);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchstart', onDown);
      document.removeEventListener('touchend', onUp);
      document.removeEventListener('touchcancel', onUp);
      document.removeEventListener('contextmenu', onMenu);
    };
  }, []);

  // キャラ読込 & spells.json fetch
  useEffect(() => {
    const char = loadCharacter();
    setCharacter(char);
    fetch('spells.json')
      .then(r => r.json())
      .then(data => {
        setSpells(data);
        if (char) {
          const lv = char.lv || 1;
          const ids = calcLearnedIds(data, lv);
          setLearnedIds(ids);
          saveLearnedIds(ids);
        }
      })
      .catch(() => setSpells([]))
      .finally(() => setLoading(false));
  }, []);

  const learnedCount = learnedIds.length;
  const totalCount   = spells.length;

  const filters = [
    { key: 'all',    label: 'すべて' },
    { key: 'attack', label: 'こうげき' },
    { key: 'heal',   label: 'かいふく' },
    { key: 'buff',   label: 'バフ' },
  ];

  // キャラ未登録
  if (!loading && !character) {
    return (
      <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center',
        justifyContent: 'center', padding: '20px 12px', position: 'relative', zIndex: 1 }}>
        <DQWindow title="◆ まほうの まきもの ◆" style={{ width: '100%', maxWidth: 500 }}>
          <div style={{ textAlign: 'center', padding: '30px 0', lineHeight: 2.5 }}>
            <div style={{ fontSize: 10, color: '#ff8080', marginBottom: 20 }}>
              キャラクターが　みつかりません
            </div>
            <button className="dq-btn" onClick={() => { selectSound(); location.href='board.html'; }}>
              ← ギルド本部へ戻る
            </button>
          </div>
        </DQWindow>
      </div>
    );
  }

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center',
      padding: '20px 12px 40px', paddingTop: 'max(20px, env(safe-area-inset-top))', position: 'relative', zIndex: 1 }}>

      {/* ヘッダー */}
      <div style={{ textAlign: 'center', marginBottom: 20 }}>
        <div style={{ fontSize: 10, color: '#4040c0', letterSpacing: 4, marginBottom: 6 }}>📜 ✨ 📜</div>
        <div style={{ fontSize: 14, color: '#ffec40', letterSpacing: 4,
          textShadow: '2px 2px #000, 0 0 20px rgba(255,220,0,0.4)', marginBottom: 4 }}>
          まほうの　まきもの
        </div>
        <div style={{ fontSize: 9, color: '#8080c0', letterSpacing: 3 }}>SPELL SCROLL</div>
      </div>

      <div style={{ width: '100%', maxWidth: 600 }}>
        <DQWindow title="◆ まほうの まきもの ◆">
          {/* 習得数カウンター */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
            <span style={{ fontSize: 8, color: '#a0c0ff' }}>しゅうとく呪文</span>
            <span style={{ fontSize: 10, color: '#ffd700' }}>{learnedCount} / {totalCount}</span>
          </div>

          {/* フィルター */}
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 14 }}>
            {filters.map(f => (
              <button
                key={f.key}
                className={`filter-btn${filter === f.key ? ' active' : ''}`}
                onClick={() => { cursorSound(); setFilter(f.key); }}
              >{f.label}</button>
            ))}
          </div>

          {/* 呪文一覧 */}
          {loading
            ? <div style={{ textAlign: 'center', padding: '30px 0', color: '#404070', fontSize: 9 }}>よみこみ中...</div>
            : <SpellList spells={spells} learnedIds={learnedIds} filter={filter} />
          }
        </DQWindow>

        <div style={{ textAlign: 'center', marginTop: 16 }}>
          <button className="dq-btn" onClick={() => { selectSound(); location.href='board.html'; }}>← ギルド本部へ戻る</button>
        </div>
      </div>

      <div style={{ marginTop: 20, fontSize: 7, color: '#2a2a60', textAlign: 'center', letterSpacing: 2 }}>
        ADVENTURER'S GUILD © {new Date().getFullYear()}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
