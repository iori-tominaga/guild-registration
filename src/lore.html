const { useState, useEffect, useRef, useCallback } = React;

// ─── Sound ───────────────────────────────────────────────────────
const ctx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq=440, dur=0.08, vol=0.15, type='square') {
  try {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur);
  } catch(e) {}
}
const cursorSound = () => beep(300, 0.05, 0.1);
const selectSound = () => { beep(440, 0.08, 0.15); setTimeout(() => beep(660, 0.08, 0.12), 80); };

// ─── Typewriter hook ──────────────────────────────────────────────
function useTypewriter(text, speed=28) {
  const [displayed, setDisplayed] = useState('');
  useEffect(() => {
    setDisplayed('');
    if (!text) return;
    let i = 0;
    const id = setInterval(() => {
      i++;
      setDisplayed(text.slice(0, i));
      if (i >= text.length) clearInterval(id);
    }, speed);
    return () => clearInterval(id);
  }, [text, speed]);
  return displayed;
}

// ─── DQ Window ───────────────────────────────────────────────────
function DQWindow({ title, children, style }) {
  return (
    <div className="dq-window" style={style}>
      {title && <div className="dq-title-bar">{title}</div>}
      <div className="dq-content">{children}</div>
    </div>
  );
}

// ─── Monster Lore Data ───────────────────────────────────────────
const MONSTER_LORE = [
  { id:'slime', name:'スライム', type:'スライム系', lv:1, icon:'🟦',
    lore:'太古の創世記に記されし最初の魔物なりと伝えられる。天地がまだ混沌に包まれていた時代、大地の霊気が凝固して生まれた原初の生命体とも言われ、魔物学者の間では「全モンスターの祖型」として研究対象となっている。大陸全土の平野・洞窟・水辺を問わず生息し、その分布域は他のいかなる種をも凌駕する。かつて英雄ラグナ・ドワーブは「スライムを侮る者は剣士失格」との言葉を残したが、その言葉通り、油断した新米冒険者が集団のスライムに囲まれて命を落とした記録は枚挙に暇がない。単体では脅威に乏しいがその粘液は鎧を腐食し、大群になれば騎士団すら足止めするという。恐れられる理由はその数と適応力——いかなる環境でも生き延びるその生命力は、まさに原初の魔物に相応しき頑強さなりと語り継がれている。' },
  { id:'red-slime', name:'あかスライム', type:'スライム系', lv:1, icon:'🔴',

    lore:'人型でありながら人ならざる者として、大陸の民から長く恐れられてきた種族なり。起源については諸説あるが、最も信憑性が高いとされる説は「古代魔導文明が戦争のために生み出した人工戦士族」というものであり、その知性と組織力は人間社会に匹敵すると記録されている。独自の言語・文化・族長制度を持ち、山岳地帯や深い森の奥に集落を形成して暮らしている。二百年以上の平和が続いた後、族長「鉄牙のグラグ」の下で組織された集落連合が辺境の村落を次々と襲撃した事件は「グラグの咆哮」として歴史書に記されており、騎士団との衝突は三年にわたったと伝えられる。個体の戦闘力も高いが、それ以上に危険なのは集団時の組織的な戦術行動であり、個人の技量で挑もうとした冒険者が返り討ちにあった例は少なくない。' },
  { id:'skeleton', name:'スケルトン', type:'不死系', lv:3, icon:'💀',
    lore:'かつて戦いの中で倒れた戦士の骸骨が、強力な死霊魔法によって意思を植え付けられ、不死の兵士として蘇った者たちなりと伝えられる。その起源を辿れば、三百年前の大魔術師ヴォルス・ネクローマが死者の軍団を作り上げようとした禁断の実験に行き着くとも言われる。生きた者には感じられぬ恐怖も痛みも死への恐れも持たず、ただ与えられた命令のみを忠実に実行する。廃墟・地下迷宮・呪われた古戦場に多く現れ、かつての戦士としての技能を忘れぬまま剣や斧を振るう。英雄マレン・ライトシールドは「骸骨の剣士と戦った夜、自分が何と剣を交えているかを一瞬忘れた。それほど剣技は洗練されていた」と述懐している。打撃への耐性が高く、刃も骨の間をすり抜けるため、通常の剣での討伐は極めて難しい。光の呪文に弱いという弱点のみが、冒険者の希望の光なりと語り継がれているのなり。' },
  { id:'golem', name:'ゴーレム', type:'魔獣系', lv:4, icon:'🗿',
    lore:'古代の魔導師たちが「永遠に動き続ける番人」を求めて生み出した、石と魔力の結晶なりと博物誌の古いページは語る。その材質は花崗岩・玄武岩・魔鉱石など様々であり、素材に込められた魔力の量によって知性と戦闘力が決定されると研究者たちは考えている。自らを作った主の命令を絶対的な法として守り続け、主が死してなお何百年も同じ命令を遂行し続けた個体の記録も存在する。古代遺跡・封印された塔・魔術師の廃屋などを主な生息地とするが、これはそれらの場所が本来の「任務地」だからなりと考えられている。五十年前、封印が解けた古代の塔から現れた巨大ゴーレムが麓の街に向かって歩き始め、討伐隊が六百人もの兵力を投じてようやく足を止めたという事件は「石の進軍」として今も語られる。その巨体から繰り出す一撃は防御の固い騎士の盾ですら砕くと言われ、速度は遅いがその耐久力に諦めを感じた冒険者も多いのなり。' },
  { id:'dark-knight', name:'あんこくのきし', type:'人型', lv:4, icon:'🖤',
    lore:'かつて王国の守護を誓った騎士が、闇の力と取引をして不死を手に入れ、魂と引き換えに永遠に戦場を彷徨う存在と成り果てた者なりと伝説は語る。その鎧は元の王国の紋章が刻まれたままであり、見る者に「かつてここに人がいた」という凄惨な事実を突きつけると言われる。百五十年前の内乱時代、国王に裏切られた将軍ヴァルス・ダークメアが闇の神殿に魂を捧げて蘇ったのが始祖なりと伝えられ、彼が率いる呪われた騎士団は三つの王国を滅ぼしたという。元が優秀な騎士であるため剣技は洗練されており、かつての戦場の記憶を本能的に活用する戦術眼を持つ。英雄ガレス・ドーンブレイカーがこの種の討伐に半生を費やし「剣で倒せる相手ではない。まず光の呪文で闇を払え」との戦術書を残したことが、後の冒険者たちの命を救ったとされているのなり。' },
  { id:'wyvern', name:'ワイバーン', type:'ドラゴン系', lv:5, icon:'🐲',
    lore:'竜種の中では最も人間界に近い高度を飛翔し、最も多くの人命を奪ってきた空の脅威なりと飛行獣研究者たちは記す。真の竜には及ばぬも、翼の展開幅は十五メートルを超え、その翼を一振りするだけで馬車を転覆させる暴風が生まれるという。猛禽類の本能と竜の知性の半分を持ち合わせた存在であり、縄張り意識が強く、一度標的と定めた者は地の果てまで追うとも言われる。かつて「蒼天の要塞」と呼ばれた山岳都市は、ワイバーンの群れに三日三晩攻撃を受け続け廃城と化した。当時の領主が残した「空が影に覆われたとき、すでに逃げ場はなかった」という手記は、後の冒険者たちに空の脅威を学ばせるための教材として今も使われている。地上では足が遅いが、一度飛翔すれば追いつける騎馬はなく、炎の息吹と鋭い爪による同時攻撃は最上位の冒険者でなければ対応できないのなり。' },
  { id:'dragon-lord', name:'りゅうおう', type:'ドラゴン系', lv:5, icon:'🐉',
    lore:'古代の竜王伝説において「大地と天空と深淵のすべてを統べる竜族の頂点」として描かれる、この世で最も古く最も強大な存在なりと、幾千年の歴史書の全てが一致して記している。その起源は世界の創世に遡り、天地を分けた神々がこの世界に置き去りにした「力の結晶」が竜の形をとったものだという説が、魔導書研究者の間では最も有力視されている。直接の目撃証言はほとんど存在せず、存在そのものを疑う学者もいるほどなれど、遠い北方の凍土に「竜王の玉座」と呼ばれる山脈が実在することは確認されている。かつて伝説の勇者カルサ・エルウィンが単身で挑み、三日三晩の死闘の末に辛くも退けたという伝承が残る。コーデックスの古いページには「竜王の真の姿を見た者は、世界の真実を知り、そして沈黙を選ぶ」との一文が記されているが、その意味を解した者は未だなしとのことなり。' },
];

// ─── NPC Card ────────────────────────────────────────────────────
function NpcCard({ npc }) {
  return (
    <div className="npc-card parchment">
      <span className="npc-portrait">{npc.icon}</span>
      <div className="npc-name parchment-title">{npc.name}</div>
      <div className="npc-title">{npc.title}</div>
      <div className="npc-quote-wrap">
        <div className="npc-quote">「{npc.quote}」</div>
      </div>
      <div className="parchment-text">{npc.lore}</div>
      {npc.secret && (
        <div className="npc-secret">
          ⚠ この人物については、ギルドの古い記録にも不審な点が多い。<br/>
          「コーデックス」の真相を知る者は未だ現れず……
        </div>
      )}
    </div>
  );
}

// ─── Monster Accordion Item ───────────────────────────────────────
function MonsterItem({ monster }) {
  const [open, setOpen] = useState(false);
  const toggle = () => { cursorSound(); setOpen(v => !v); };
  return (
    <div className="monster-item">
      <div className="monster-header" onClick={toggle}>
        <span className="monster-icon">{monster.icon}</span>
        <div className="monster-name-lv">
          <div className="monster-mname">{monster.name}</div>
          <div className="monster-type">{monster.type} · Lv{monster.lv}</div>
        </div>
        <span className={`monster-toggle${open ? ' open' : ''}`}>▼</span>
      </div>
      {open && (
        <div className="monster-lore">
          <div className="parchment-text">{monster.lore}</div>
        </div>
      )}
    </div>
  );
}

// ─── Main App ────────────────────────────────────────────────────
function App() {
  const title = useTypewriter('◆ でんしょうの　ま ◆', 60);

  return (
    <div id="root">
      <div className="page-header">{title || '　'}</div>
      <div className="page-subtitle">
        ギルドに伝わる者たちの記録と、魔物の伝承を綴る古書なり。<br/>
        知りたければ、ページをめくるがよい。
      </div>

      <div className="page-container">

        {/* ─── NPC Section ─── */}
        <DQWindow title="◆ ギルドに　かかわる　もの　たち ◆">
          <div className="ancient-divider">— 人物録 —</div>
          {NPCS.map(npc => <NpcCard key={npc.id} npc={npc} />)}
        </DQWindow>

        <div className="section-gap" />

        {/* ─── Monster Lore Section ─── */}
        <DQWindow title="◆ まもの　でんしょうし ◆">
          <div className="ancient-divider">— 魔物誌 —</div>
          <div style={{fontSize:8, color:'#a0c0ff', marginBottom:16, lineHeight:2}}>
            ▼ 名前を選ぶと伝承が開く
          </div>
          {MONSTER_LORE.map(m => <MonsterItem key={m.id} monster={m} />)}
        </DQWindow>

        <div className="section-gap" />

        {/* ─── Footer / Back ─── */}
        <div className="back-area">
          <button className="dq-btn" onClick={() => { selectSound(); location.href='board.html'; }}>
            ← ギルド　ほんぶへ
          </button>
        </div>

        <div style={{textAlign:'center', marginTop:20, fontSize:7, color:'#303060', lineHeight:2}}>
          この書は伝承の守り人によって記されたなり。<br/>
          無断で持ち出す者には、相応の呪いを覚悟されたし。
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
